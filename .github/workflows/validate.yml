name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite reexecutar o workflow com os secrets atuais (ex.: apos cadastrar a keystore).
  workflow_dispatch:
    inputs:
      require_signed:
        description: "Exigir build de release assinado com a keystore configurada nos secrets"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: TypeScript typecheck and Jest unit tests (players)
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Repository hygiene guard (aistudio assets, secrets, oversized files, old IPKs)
        run: node scripts/check-repo-hygiene.mjs

      - name: Verify published remote manifest URLs (against committed manifests)
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork || false }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          TV_VER=$(python3 -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")
          IPK_FILE="smart-tv/mk21play_${TV_VER}_all.ipk"

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_FORK_PR" = "true" ]; then
            if ! curl -sfI --max-time 5 https://github.com > /dev/null 2>&1; then
              echo "::notice::PR de fork sem acesso de rede externa: validação --remote pulada com justificativa (push para main exige HTTP 200/206 e hash remoto)."
              echo "- ⚠️ **Validação remota (\`--remote\`)**: pulada em PR de fork sem rede externa." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # Quando um commit eleva a versão (ex.: 2.9.0 -> 2.9.1), a tag v2.9.1 ainda não existe
          # no GitHub Releases até o workflow release.yml concluir a publicação.
          # Nesses casos, validamos os manifestos localmente aqui e deixamos o --remote para o release.yml.
          if ! curl -sfI --max-time 10 "https://github.com/${REPO_SLUG}/releases/tag/v${TV_VER}" > /dev/null 2>&1; then
            echo "::notice::Release v${TV_VER} ainda não publicado no GitHub Releases; validação --remote será executada pelo workflow release.yml após a publicação."
            echo "- ℹ️ **Validação remota (\`--remote\`)**: release \`v${TV_VER}\` ainda não publicado; validação local completa executada abaixo." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/verify-release-manifests.mjs --apk mk21.apk --ipk "$IPK_FILE" --remote

      - name: Prepare release keystore
        id: release-keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          SECRET_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
          LICENSE_PUBKEY_B64: ${{ secrets.LICENSE_PUBKEY_B64 }}
          REQUIRE_SIGNED: ${{ github.event.inputs.require_signed || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ]; then
            if [ "${REQUIRE_SIGNED}" = "true" ]; then
              echo "::error::Secrets ANDROID_KEYSTORE_BASE64/STORE_PASSWORD ausentes com require_signed=true."
              exit 1
            fi
            echo "::warning::Secrets ANDROID_KEYSTORE_BASE64/STORE_PASSWORD ausentes: o APK do artifact sairá assinado com a chave de debug."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "cert_pin=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$KEY_ALIAS" != "upload" ]; then
            echo "::error::KEY_ALIAS está definido como '$KEY_ALIAS', mas app/build.gradle.kts usa alias 'upload' no signingConfigs.release."
            exit 1
          fi

          # Build de release exige o segredo de licença (sem fallback embutido no APK).
          if [ -z "${LICENSE_SECRET:-}" ] || [ "${#LICENSE_SECRET}" -lt 16 ]; then
            echo "::error::Secret LICENSE_SECRET ausente ou curto (mín. 16 caracteres): obrigatório para build de release assinado."
            exit 1
          fi

          # Chave pública ECDSA P-256: opcional durante homologação (fallback HMAC via LICENSE_SECRET).
          if [ -z "${LICENSE_PUBKEY_B64:-}" ]; then
            echo "::warning::Secret LICENSE_PUBKEY_B64 ausente: build seguirá em modo de homologação (HMAC via LICENSE_SECRET). Configure LICENSE_PUBKEY_B64 ao reativar ECDSA."
          fi

          KS="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/mk21-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          # Valida senha e alias antes de gastar o build: erro aqui aponta secret errado,
          # em vez de gerar um APK assinado com uma chave nova a cada run.
          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          CERT_PIN="${SECRET_CERT_SHA256:-}"
          if [ -z "$CERT_PIN" ]; then
            CERT_PIN=$(keytool -list -v -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
              | awk -F'SHA256:' '/SHA256:/ {gsub(/[^A-Fa-f0-9]/, "", $2); print tolower($2); exit}')
          else
            CERT_PIN=$(printf '%s' "$CERT_PIN" | tr -cd 'A-Fa-f0-9' | tr '[:upper:]' '[:lower:]')
          fi
          if [[ ! "$CERT_PIN" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Não foi possível determinar um EXPECTED_CERT_SHA256 válido."
            exit 1
          fi
          echo "::add-mask::$CERT_PIN"
          echo "Keystore validado: alias $KEY_ALIAS, $(stat -c%s "$KS") bytes."
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "path=$KS" >> "$GITHUB_OUTPUT"
          echo "cert_pin=$CERT_PIN" >> "$GITHUB_OUTPUT"

      - name: Android tests and debug build (Pull Request without secrets)
        id: android-build-pr
        if: github.event_name == 'pull_request'
        env:
          ALLOW_LEGACY_LICENSE: ${{ vars.ALLOW_LEGACY_LICENSE || 'false' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon || { echo "Retrying tests due to socket/network hiccup..."; ./gradlew testDebugUnitTest --no-daemon; }
          ./gradlew assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK não encontrado: $APK"; exit 1; }
          echo "apk_source=$APK" >> "$GITHUB_OUTPUT"

      - name: Android tests and build (main/dispatch)
        id: android-build-signed
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEYSTORE_PATH: ${{ steps.release-keystore.outputs.path }}
          EXPECTED_CERT_SHA256: ${{ steps.release-keystore.outputs.cert_pin || '' }}
          SIGNED: ${{ steps.release-keystore.outputs.signed }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
          LICENSE_PUBKEY_B64: ${{ secrets.LICENSE_PUBKEY_B64 }}
          ALLOW_LEGACY_LICENSE: ${{ vars.ALLOW_LEGACY_LICENSE || 'false' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon || { echo "Retrying tests due to socket/network hiccup..."; ./gradlew testDebugUnitTest --no-daemon; }
          if [ "$SIGNED" = "true" ]; then
            test -f "$KEYSTORE_PATH" || { echo "Keystore de release ausente: $KEYSTORE_PATH"; exit 1; }
            # Sem KEY_PASSWORD próprio, assume a senha do keystore (caso comum).
            if [ -z "${KEY_PASSWORD:-}" ]; then export KEY_PASSWORD="$STORE_PASSWORD"; fi
            ./gradlew assembleRelease --no-daemon
            APK=app/build/outputs/apk/release/app-release.apk
            test -f "$APK" || APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          else
            ./gradlew assembleDebug --no-daemon
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK" || { echo "APK não encontrado: $APK"; exit 1; }
          echo "apk_source=$APK" >> "$GITHUB_OUTPUT"

      - name: Package IPK and stamp build hashes
        id: package-and-stamp
        env:
          APK_SOURCE: ${{ steps.android-build-signed.outputs.apk_source || steps.android-build-pr.outputs.apk_source }}
          SIGNED: ${{ steps.release-keystore.outputs.signed || 'false' }}
        run: |
          set -euo pipefail
          # O empacotador publica apkSha256/sizeBytes e ipkSha256/ipkSizeBytes nos manifestos,
          # então ele roda logo depois do build do APK, com o artefato recém-gerado.
          test -n "${APK_SOURCE:-}" || { echo "apk_source vazio: o passo de build não publicou a saída"; exit 1; }
          test -f "$APK_SOURCE" || { echo "APK do build não encontrado: $APK_SOURCE"; exit 1; }
          cp "$APK_SOURCE" mk21.apk
          npm run build:tv
          python3 smart-tv/package_ipk.py
          node scripts/sync-web.mjs

          if [ "$SIGNED" = "true" ]; then
            # Garante que o carimbo foi feito sobre o APK de release, não sobre um fallback de debug.
            APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
            test -n "$APKSIGNER" || { echo "apksigner não encontrado para validar a assinatura"; exit 1; }
            "$APKSIGNER" verify --verbose mk21.apk > /dev/null
            CERTS="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/mk21-certs.txt"
            # Guarda a saída em arquivo: ler de pipe com head/grep -q pode gerar SIGPIPE e
            # derrubar o passo por causa do pipefail do shell do Actions.
            "$APKSIGNER" verify --print-certs mk21.apk > "$CERTS"
            sed -n '1,6p' "$CERTS"
            if grep -q "CN=Android Debug" "$CERTS"; then
              echo "APK saiu com a chave de debug mesmo com os secrets configurados"
              exit 1
            fi
          fi

          python3 - <<'PY'
          import hashlib, json, os, sys

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as file:
                  for chunk in iter(lambda: file.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          apk_sha256 = sha256("mk21.apk")
          apk_size = os.path.getsize("mk21.apk")
          failures = []
          manifests = (
              "version.json",
              "api/version.json",
              "web/version.json",
              "web/api/version.json",
              "public/version.json",
              "public/api/version.json",
              "smart-tv/version.json",
              "smart-tv/mk21-tv/version.json",
          )
          for name in manifests:
              with open(name, encoding="utf-8") as f:
                  data = json.load(f)
              ipk_path = f"smart-tv/mk21play_{data['version']}_all.ipk"
              ipk_sha256 = sha256(ipk_path)
              if data["apkSha256"] != apk_sha256 or data["sizeBytes"] != apk_size:
                  failures.append(f"{name}: apkSha256/sizeBytes não batem com mk21.apk")
              # O manifesto embutido no pacote não pode carregar o hash do próprio IPK.
              if name != "smart-tv/mk21-tv/version.json":
                  if data["ipkSha256"] != ipk_sha256 or data["ipkSizeBytes"] != os.path.getsize(ipk_path):
                      failures.append(f"{name}: ipkSha256/ipkSizeBytes não batem com {ipk_path}")
              print(f"{name}: v{data['version']} apk={data['apkSha256'][:12]} ipk={ipk_sha256[:12]}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

          VER=$(python3 -c "import json; print(json.load(open('smart-tv/version.json'))['version'])")
          IPK="smart-tv/mk21play_${VER}_all.ipk"
          {
            echo "### Pacotes gerados e carimbados"
            echo ""
            if [ "$SIGNED" = "true" ]; then
              APK_KIND="release assinado com a keystore de upload"
            else
              APK_KIND="debug (sem keystore nos secrets)"
            fi
            echo "- APK ($APK_KIND): \`$(sha256sum mk21.apk | cut -d' ' -f1)\` ($(stat -c%s mk21.apk) bytes)"
            echo "- IPK v${VER}: \`$(sha256sum "$IPK" | cut -d' ' -f1)\` ($(stat -c%s "$IPK") bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smart TV and version sync validation
        id: smart-tv-validation
        run: |
          set -euo pipefail
          node scripts/sync-web.mjs --check
          node --check js/observability.js
          node --check smart-tv/mk21-tv/observability.js
          node --check smart-tv/mk21-tv/app.js
          node --check api/proxy.js
          node --check web/api/proxy.js
          node --check api/epg.js
          node --check web/api/epg.js
          node --check api/sync.js
          node --check web/api/sync.js
          node --check api/subtitles.js
          node --check web/api/subtitles.js
          node --check api/homolog-logs.js
          node --check web/api/homolog-logs.js
          node --test smart-tv/tests/proxy-security.test.js smart-tv/tests/alternative-sources.test.js smart-tv/tests/catalog-utils.test.js smart-tv/tests/release-manifest.test.js smart-tv/tests/epg-guide.test.js smart-tv/tests/zap-hud.test.js smart-tv/tests/on-screen-keyboard.test.js smart-tv/tests/tv-guide-integration.test.js smart-tv/tests/parental-control.test.js smart-tv/tests/public-epg.test.js smart-tv/tests/smart-tv-prefs.test.js smart-tv/tests/cloud-sync.test.js smart-tv/tests/subtitles-and-skip.test.js smart-tv/tests/license-api.test.js smart-tv/tests/observability.test.js smart-tv/tests/homolog-logs.test.js smart-tv/tests/repo-hygiene.test.js
          node scripts/verify-release-manifests.mjs --apk mk21.apk --ipk "smart-tv/mk21play_$(python3 -c "import json; print(json.load(open('version.json'))['version'])")_all.ipk"
          python3 -m py_compile smart-tv/package_ipk.py
          python3 -m unittest discover -s smart-tv/tests -v

          TV_VER=$(python3 - <<'PY'
          import json, re, sys, xml.etree.ElementTree as ET

          with open("version.json", encoding="utf-8") as f:
              root_manifest = json.load(f)
          target_ver = str(root_manifest["version"])
          target_code = int(root_manifest["versionCode"])

          version_json_files = (
              "version.json",
              "api/version.json",
              "web/version.json",
              "web/api/version.json",
              "public/version.json",
              "public/api/version.json",
              "smart-tv/version.json",
              "smart-tv/mk21-tv/version.json",
          )
          errors = []
          for path in version_json_files:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              if str(data.get("version")) != target_ver:
                  errors.append(f"{path}: version={data.get('version')} != {target_ver}")
              if int(data.get("versionCode", -1)) != target_code:
                  errors.append(f"{path}: versionCode={data.get('versionCode')} != {target_code}")
              if "versionName" in data and str(data.get("versionName")) != target_ver:
                  errors.append(f"{path}: versionName={data.get('versionName')} != {target_ver}")

          simple_json_files = (
              "package.json",
              "web/package.json",
              "manifest.json",
              "web/manifest.json",
              "public/manifest.json",
              "smart-tv/mk21-tv/appinfo.json",
              "smart-tv/webos/appinfo.json",
          )
          for path in simple_json_files:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              if str(data.get("version")) != target_ver:
                  errors.append(f"{path}: version={data.get('version')} != {target_ver}")

          tizen_ver = ET.parse("smart-tv/tizen/config.xml").getroot().attrib.get("version")
          if tizen_ver != target_ver:
              errors.append(f"smart-tv/tizen/config.xml: version={tizen_ver} != {target_ver}")

          with open("app/build.gradle.kts", encoding="utf-8") as f:
              gradle_text = f.read()
          code_match = re.search(r"^\s*versionCode\s*=\s*(\d+)", gradle_text, re.MULTILINE)
          name_match = re.search(r'^\s*versionName\s*=\s*"([^"]+)"', gradle_text, re.MULTILINE)
          gradle_code = int(code_match.group(1)) if code_match else None
          gradle_name = name_match.group(1) if name_match else None
          if gradle_code != target_code:
              errors.append(f"app/build.gradle.kts: versionCode={gradle_code} != {target_code}")
          if gradle_name != target_ver:
              errors.append(f"app/build.gradle.kts: versionName={gradle_name} != {target_ver}")

          if errors:
              print("Falha de sincronismo de versão:", file=sys.stderr)
              for err in errors:
                  print(f" - {err}", file=sys.stderr)
              sys.exit(1)

          print(target_ver)
          PY
          )

          IPK_FILE="smart-tv/mk21play_${TV_VER}_all.ipk"
          test -f "$IPK_FILE" || { echo "IPK $IPK_FILE não encontrado"; exit 1; }
          PKG_VER=$(dpkg-deb --field "$IPK_FILE" Version)
          test "$PKG_VER" = "$TV_VER" || { echo "Versão interna do pacote IPK $PKG_VER difere de $TV_VER"; exit 1; }
          if [[ ! "$TV_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida em tv_version: '$TV_VER'"
            exit 1
          fi
          echo "Sincronismo multiplataforma e Smart TV IPK $TV_VER validados com sucesso."
          echo "tv_version=$TV_VER" >> "$GITHUB_OUTPUT"

      - name: Write artifact checksums
        run: |
          set -euo pipefail
          VER=$(python3 -c "import json; print(json.load(open('smart-tv/version.json'))['version'])")
          IPK="smart-tv/mk21play_${VER}_all.ipk"
          # Ordem fixa e caminhos relativos à raiz: "sha256sum -c SHA256SUMS"
          # funciona direto no artifact extraído.
          sha256sum \
            mk21.apk \
            "$IPK" \
            version.json \
            api/version.json \
            web/version.json \
            web/api/version.json \
            public/version.json \
            public/api/version.json \
            smart-tv/version.json \
            smart-tv/mk21-tv/version.json \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload generated apps
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-apps
          path: |
            mk21.apk
            smart-tv/mk21play_${{ steps.smart-tv-validation.outputs.tv_version }}_all.ipk
            version.json
            api/version.json
            web/version.json
            web/api/version.json
            public/version.json
            public/api/version.json
            smart-tv/version.json
            smart-tv/mk21-tv/version.json
            SHA256SUMS
          if-no-files-found: error

      - name: List generated apps
        env:
          TV_VERSION: ${{ steps.smart-tv-validation.outputs.tv_version }}
        run: |
          set -euo pipefail
          echo "## Aplicativos gerados" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android APK: \`mk21.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smart TV IPK: \`smart-tv/mk21play_${TV_VERSION}_all.ipk\`" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "Aplicativos gerados:"
          echo "  Android APK: mk21.apk"
          echo "  Smart TV IPK: smart-tv/mk21play_${TV_VERSION}_all.ipk"
