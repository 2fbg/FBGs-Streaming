name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android tests and build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Smart TV validation
        run: |
          node --check smart-tv/mk21-tv/app.js
          python3 -m py_compile smart-tv/package_ipk.py
          test "$(python3 -c "import json; print(json.load(open('smart-tv/version.json'))['version'])")" = "3.7.6"
