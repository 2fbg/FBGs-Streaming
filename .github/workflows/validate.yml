name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android tests and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon || (echo "Retrying tests due to socket/network hiccup..." && ./gradlew testDebugUnitTest --no-daemon)
          ./gradlew assembleDebug --no-daemon

      - name: Smart TV validation
        id: smart-tv-validation
        run: |
          node --check smart-tv/mk21-tv/app.js
          python3 -m py_compile smart-tv/package_ipk.py
          python3 smart-tv/package_ipk.py

          TV_VER=$(python3 -c "import json; print(json.load(open('smart-tv/version.json'))['version'])")
          test "$TV_VER" = "$(python3 -c "import json; print(json.load(open('smart-tv/mk21-tv/version.json'))['version'])")"
          test "$TV_VER" = "$(python3 -c "import json; print(json.load(open('smart-tv/mk21-tv/appinfo.json'))['version'])")"
          test "$TV_VER" = "$(python3 -c "import json; print(json.load(open('smart-tv/webos/appinfo.json'))['version'])")"
          test "$TV_VER" = "$(python3 -c "import json; print(json.load(open('web/version.json'))['version'])")"
          test "$TV_VER" = "$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          TIZEN_VER=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('smart-tv/tizen/config.xml').getroot().attrib['version'])")
          test "$TV_VER" = "$TIZEN_VER"

          IPK_FILE="smart-tv/mk21play_${TV_VER}_all.ipk"
          test -f "$IPK_FILE"
          PKG_VER=$(dpkg-deb --field "$IPK_FILE" Version)
          test "$PKG_VER" = "$TV_VER"
          echo "Smart TV IPK $TV_VER validado com sucesso."
          echo "tv_version=$TV_VER" >> "$GITHUB_OUTPUT"

      - name: Upload generated apps
        uses: actions/upload-artifact@v4
        with:
          name: generated-apps
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            smart-tv/mk21play_${{ steps.smart-tv-validation.outputs.tv_version }}_all.ipk
          if-no-files-found: error

      - name: List generated apps
        run: |
          echo "## Aplicativos gerados" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android APK: \`app/build/outputs/apk/debug/app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smart TV IPK: \`smart-tv/mk21play_${{ steps.smart-tv-validation.outputs.tv_version }}_all.ipk\`" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "Aplicativos gerados:"
          echo "  Android APK: app/build/outputs/apk/debug/app-debug.apk"
          echo "  Smart TV IPK: smart-tv/mk21play_${{ steps.smart-tv-validation.outputs.tv_version }}_all.ipk"
