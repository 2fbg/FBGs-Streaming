name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release a publicar (vazio = lê versão atual de version.json)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Validação em seco: valida secrets, assinatura e carimbo sem publicar release ou commitar em main"
        required: false
        default: false
        type: boolean
      force:
        description: "Republicar mesmo se a release já estiver publicada (sobrescreve os assets)"
        required: false
        default: false
        type: boolean

concurrency:
  # Grupo fixo: publicações de release são serializadas entre si, independente do ref.
  # Sem isso, push na main e push de tag caem em grupos distintos e competem pela mesma release.
  group: release-publication
  cancel-in-progress: false

permissions: {}

jobs:
  check-release-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            version.json
            app/build.gradle.kts
          persist-credentials: false

      - name: Determine target release tag and whether publication is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_FULL: ${{ github.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          MANIFEST_VER=$(python3 -c 'import json; print(str(json.load(open("version.json", encoding="utf-8"))["version"]).strip())')

          if [[ "$GITHUB_REF_FULL" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_TAG// /}" ]; then
            TAG="${INPUT_TAG// /}"
          else
            TAG="v${MANIFEST_VER}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag inválida para release: '$TAG' (esperado formato vX.Y.Z)."
            exit 1
          fi

          # Regra única para push de branch, push de tag e dispatch: release publicada não se toca.
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [ "$IS_DRAFT" = "false" ] && [ "${FORCE:-false}" != "true" ]; then
            echo "::notice::Release $TAG já está publicada; assets preservados (use force=true para sobrescrever)."
            echo "- ℹ️ Release \`$TAG\` já está publicada; assets preservados. Para publicar de novo, rode workflow_dispatch com \`force=true\` ou incremente a versão." >> "$GITHUB_STEP_SUMMARY"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Publicação habilitada para $TAG (status atual: $IS_DRAFT, force=$FORCE)."

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: check-release-needed
    if: needs.check-release-needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Resolve release tag and validate signing secrets
        id: release-meta
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          SECRET_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
          RESOLVED_TAG: ${{ needs.check-release-needed.outputs.tag }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          TAG="${RESOLVED_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag inválida para release: '$TAG' (esperado formato vX.Y.Z)."
            exit 1
          fi
          VER="${TAG#v}"

          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 e STORE_PASSWORD são obrigatórios para publicar release."
            exit 1
          fi
          if [ "$KEY_ALIAS" != "upload" ]; then
            echo "::error::KEY_ALIAS está definido como '$KEY_ALIAS', mas app/build.gradle.kts exige alias 'upload'."
            exit 1
          fi
          if [ -z "${LICENSE_SECRET:-}" ] || [ "${#LICENSE_SECRET}" -lt 16 ] || [ "$LICENSE_SECRET" = "MK21_DEFAULT_HMAC_SECRET" ]; then
            echo "::error::Secret LICENSE_SECRET ausente, curto (<16) ou igual ao fallback antigo: obrigatório para publicar release."
            exit 1
          fi

          KS="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/mk21-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          chmod 600 "$KS"

          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          # Extrai o SHA-256 do certificado de upload (ou usa o secret explícito), sem expor senhas.
          CERT_PIN="${SECRET_CERT_SHA256:-}"
          if [ -z "$CERT_PIN" ]; then
            CERT_PIN=$(keytool -list -v -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
              | awk -F'SHA256:' '/SHA256:/ {gsub(/[^A-Fa-f0-9]/, "", $2); print tolower($2); exit}')
          else
            CERT_PIN=$(printf '%s' "$CERT_PIN" | tr -cd 'A-Fa-f0-9' | tr '[:upper:]' '[:lower:]')
          fi
          if [[ ! "$CERT_PIN" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Não foi possível determinar um EXPECTED_CERT_SHA256 válido."
            exit 1
          fi

          # Confere se a tag bate com app/build.gradle.kts e version.json antes de compilar.
          python3 - "$VER" <<'PY'
          import json, re, sys
          ver = sys.argv[1]
          with open("version.json", encoding="utf-8") as f:
              manifest_ver = str(json.load(f).get("version"))
          with open("app/build.gradle.kts", encoding="utf-8") as f:
              gradle_text = f.read()
          m = re.search(r'^\s*versionName\s*=\s*"([^"]+)"', gradle_text, re.MULTILINE)
          gradle_ver = m.group(1) if m else None
          if manifest_ver != ver or gradle_ver != ver:
              print(f"::error::Tag v{ver} diverge de version.json ({manifest_ver}) ou build.gradle.kts ({gradle_ver}).", file=sys.stderr)
              sys.exit(1)
          PY

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$KS" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$CERT_PIN"
          echo "cert_pin=$CERT_PIN" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Test and build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEYSTORE_PATH: ${{ steps.release-meta.outputs.keystore_path }}
          EXPECTED_CERT_SHA256: ${{ steps.release-meta.outputs.cert_pin }}
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
          ALLOW_LEGACY_LICENSE: ${{ vars.ALLOW_LEGACY_LICENSE || 'false' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -z "${KEY_PASSWORD:-}" ]; then
            export KEY_PASSWORD="$STORE_PASSWORD"
          fi
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "736577956980",
              "project_id": "gen-lang-client-0474959166",
              "storage_bucket": "gen-lang-client-0474959166.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:736577956980:android:8b24803d286868ab723521",
                  "android_client_info": {
                    "package_name": "com.aistudio.multiservidor.iptvmk"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDbFO4VGaBNxxphP99Mu6NbKZ1nATzHMmI"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          ./gradlew testDebugUnitTest --no-daemon
          ./gradlew assembleRelease --no-daemon

          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          test -f "$APK" || { echo "APK de release não encontrado."; exit 1; }
          cp "$APK" mk21.apk

          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "apksigner não encontrado."; exit 1; }
          "$APKSIGNER" verify --verbose mk21.apk > /dev/null
          CERTS="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/mk21-release-certs.txt"
          "$APKSIGNER" verify --print-certs mk21.apk > "$CERTS"
          if grep -q "CN=Android Debug" "$CERTS"; then
            echo "::error::APK de release saiu assinado com chave de debug."
            exit 1
          fi
          APK_CERT_SHA=$(awk -F'SHA-256 digest:' '/SHA-256 digest:/ {gsub(/[^A-Fa-f0-9]/, "", $2); print tolower($2); exit}' "$CERTS")
          if [ "$APK_CERT_SHA" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Certificado do APK assinado diverge do pin calculado pela keystore."
            exit 1
          fi

      - name: Rewrite release URLs, package IPK and stamp manifests
        env:
          TAG: ${{ steps.release-meta.outputs.tag }}
          VER: ${{ steps.release-meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_APK_URL="https://github.com/${REPO}/releases/download/${TAG}/mk21.apk"
          RELEASE_IPK_URL="https://github.com/${REPO}/releases/download/${TAG}/mk21play_${VER}_all.ipk"
          IPK_PATH="smart-tv/mk21play_${VER}_all.ipk"

          # Atualiza URLs antes de empacotar o IPK para que smart-tv/mk21-tv/version.json embutido já carregue as URLs da release.
          python3 - "$RELEASE_APK_URL" "$RELEASE_IPK_URL" <<'PY'
          import json, sys

          release_apk_url, release_ipk_url = sys.argv[1:3]
          for path in ("version.json", "api/version.json", "smart-tv/version.json", "smart-tv/mk21-tv/version.json"):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              data["apkUrl"] = release_apk_url
              data["downloadUrl"] = release_apk_url
              data["ipkUrl"] = release_ipk_url
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          PY

          # Mantém o botão de download do site apontando para o IPK desta versão.
          python3 - "$VER" <<'PY'
          import re, sys

          ver = sys.argv[1]
          rel = f"/smart-tv/mk21play_{ver}_all.ipk"
          name = f"mk21play_{ver}_all.ipk"

          with open("index.html", encoding="utf-8") as f:
              html = f.read()

          html, n_href = re.subn(r'(<a[^>]*href=")/[^"]*\.ipk(")', rf'\g<1>{rel}\g<2>', html, count=1)
          html, n_dl = re.subn(r'(download=")[^"]*\.ipk(")', rf'\g<1>{name}\g<2>', html, count=1)
          if n_href != 1 or n_dl != 1:
              print(f"::error::Não foi possível carimbar o link do IPK em index.html (href={n_href}, download={n_dl}).", file=sys.stderr)
              sys.exit(1)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print(f"index.html: link do IPK -> {rel}")
          PY

          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build:tv

          python3 smart-tv/package_ipk.py

          python3 - "$VER" "$IPK_PATH" "$RELEASE_IPK_URL" <<'PY'
          import hashlib, json, sys

          ver, ipk_path, release_ipk_url = sys.argv[1:4]
          with open(ipk_path, "rb") as f:
              ipk_sha = hashlib.sha256(f.read()).hexdigest()

          for path in ("apps.json", "smart-tv/apps.json"):
              with open(path, "r", encoding="utf-8") as f:
                  apps = json.load(f)
              pkg = apps["packages"][0]
              pkg["version"] = ver
              # URL da GitHub Release: fica no ar assim que `gh release create` termina, sem depender
              # do commit em main (que pode exigir PR se houver proteção de branch).
              pkg["sourceUrl"] = release_ipk_url
              pkg["manifest"]["version"] = ver
              pkg["manifest"]["ipkUrl"] = pkg["sourceUrl"]
              pkg["manifest"]["ipkHash"]["sha256"] = ipk_sha
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(apps, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          PY

          node scripts/sync-web.mjs
          node scripts/sync-web.mjs --check
          node scripts/verify-release-manifests.mjs --apk mk21.apk --ipk "$IPK_PATH" --require-release-url

          # Checksums apenas dos assets publicados, com os nomes que o usuário recebe no download.
          # Assim "sha256sum -c SHA256SUMS" funciona colado ao lado dos arquivos baixados.
          {
            sha256sum mk21.apk
            sha256sum "$IPK_PATH" | sed "s|$(dirname "$IPK_PATH")/||"
          } > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        if: steps.release-meta.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          VER: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          IPK_PATH="smart-tv/mk21play_${VER}_all.ipk"
          NOTES=$(python3 -c 'import json, sys; print(json.load(open("version.json", encoding="utf-8")).get("releaseNotes", f"Release {sys.argv[1]}"))' "$TAG")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" mk21.apk "$IPK_PATH" SHA256SUMS --clobber
            gh release edit "$TAG" --draft=false --title "MK21 Play ${TAG}" --notes "$NOTES"
          else
            gh release create "$TAG" mk21.apk "$IPK_PATH" SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "MK21 Play ${TAG}" \
              --notes "$NOTES"
          fi

      - name: Verify published remote release assets
        if: steps.release-meta.outputs.dry_run != 'true'
        env:
          TAG: ${{ steps.release-meta.outputs.tag }}
          VER: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          IPK_PATH="smart-tv/mk21play_${VER}_all.ipk"
          node scripts/verify-release-manifests.mjs --apk mk21.apk --ipk "$IPK_PATH" --require-release-url --remote

          # Prova que o SHA256SUMS publicado corresponde aos binários publicados.
          TMPD=$(mktemp -d)
          trap 'rm -rf "$TMPD"' EXIT
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          curl -fsSL -o "$TMPD/mk21.apk" "$BASE/mk21.apk"
          curl -fsSL -o "$TMPD/mk21play_${VER}_all.ipk" "$BASE/mk21play_${VER}_all.ipk"
          curl -fsSL -o "$TMPD/SHA256SUMS" "$BASE/SHA256SUMS"
          ( cd "$TMPD" && sha256sum -c SHA256SUMS )

      - name: Commit updated manifests and fallback APK [skip ci]
        if: steps.release-meta.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          VER: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            mk21.apk \
            "smart-tv/mk21play_${VER}_all.ipk" \
            smart-tv/mk21-tv/app.js \
            index.html \
            web/index.html \
            public/index.html \
            version.json \
            api/version.json \
            web/version.json \
            web/api/version.json \
            public/version.json \
            public/api/version.json \
            smart-tv/version.json \
            smart-tv/mk21-tv/version.json \
            apps.json \
            web/apps.json \
            public/apps.json \
            smart-tv/apps.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos manifestos ou binários para commitar."
            exit 0
          fi

          git commit -m "chore(release): publish ${TAG} manifests and binaries [skip ci]"
          gh auth setup-git
          if ! git push origin "HEAD:main"; then
            BRANCH="chore/release-manifests-${TAG}"
            git push origin "HEAD:${BRANCH}"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): atualizar manifestos e binários ${TAG}" \
              --body "Atualização automática pós-release ${TAG} com SHA-256 real do APK/IPK publicados. [skip ci]"
          fi
