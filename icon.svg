<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1F1315" />
      <stop offset="60%" stop-color="#0E0F12" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="45%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#8B0007" />
    </linearGradient>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#E50914" flood-opacity="0.6" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGlow)" stroke="#E50914" stroke-width="4" stroke-opacity="0.3" filter="url(#cardShadow)"/>

  <!-- Subtle Top Flare -->
  <path d="M 64 24 Q 256 12 448 24" stroke="#E50914" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Logo Graphics Group -->
  <g transform="translate(68, 160)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic">
    <!-- MK Text -->
    <text x="0" y="150" font-size="160" fill="url(#silverGrad)" letter-spacing="-8">MK</text>
    <!-- 21 Laser Text -->
    <text x="210" y="150" font-size="190" fill="url(#redGrad)" filter="url(#neonRed)" letter-spacing="-10">21</text>
  </g>

  <!-- Tagline Banner -->
  <g transform="translate(256, 395)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#000000" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <text x="0" y="4" font-size="13" font-weight="800" fill="#CBD5E1" letter-spacing="4">MULTISERVIDOR IPTV</text>
  </g>
</svg>
